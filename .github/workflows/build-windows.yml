name: Generar instalador de Windows

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Compilar instalador .exe
        run: npm run dist

      - name: Publicar el instalador
        uses: actions/upload-artifact@v4
        with:
          name: ArtesaniasDMitzy-Instalador-Windows
          path: dist/*.exe
